[package]
name = "asr-app-02"
version = "0.1.0"
edition = "2024"

[dependencies]
#candle-core = { version = "0.9.2-alpha.1", path = "../../../../candle/candle-core", features = ["cuda", "cudnn"] }
#candle-nn = { version = "0.9.2-alpha.1", path = "../../../../candle/candle-nn", features = ["cuda", "cudnn"] }
#candle-transformers = { version = "0.9.2-alpha.1", path = "../../../../candle/candle-transformers", features = ["cuda", "cudnn"] }

candle-core = { version = "0.11.0", features = ["cuda", "cudnn"] }
candle-nn = { version = "0.11.0", features = ["cuda", "cudnn"] }
candle-transformers = { version = "0.11.0", features = ["cuda", "cudnn"] }

byteorder = "1.5.0"
hf-hub = "0.5.0"
ndarray = "0.17.1"
plotters = "0.3.7"
rand = "0.9.2"
rustfft = "6.4.1"
serde_json = "1.0.145"
symphonia = { version = "0.5.5", features = ["all"] }
tokenizers = "0.22.2"

#[profile.release]
#opt-level = 3          # Maximize speed (default is 3)
#lto = true             # Enable Link Time Optimization
#codegen-units = 1      # Maximize optimizations, reduces binary size (at cost of build time)
#panic = "abort"        # Reduce binary size by removing panic unwinding
#strip = "symbols"      # Remove debug info to minimize binary size

[[bin]]
name  = "melspectrogram"
path  = "src/melspectrogram.rs"
test  = false
bench = false
[[bin]]
name  = "transcribe-01-no-timestamp"
path  = "src/transcribe-01-no-timestamp.rs"
test  = false
bench = false
